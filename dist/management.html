<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="management.css">
</head>
<body>
  <div class="management-container">
    <header class="page-header">
      <div class="header-content">
        <div class="header-left">
          <img src="icons/icon48.png" class="header-icon">
          <h1>账号备注管理</h1>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索网站或用户名...">
          <span class="search-icon">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
            </svg>
          </span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="control-bar">
        <div class="sort-controls">
          <select id="sortSelect" class="sort-select">
            <option value="updateTime">按更新时间排序</option>
            <option value="username">按用户名排序</option>
            <option value="domain">按网站排序</option>
          </select>
          <button id="sortDirection" class="sort-direction" title="切换排序方向">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M7 10l5 5 5-5H7z"/>
            </svg>
          </button>
        </div>
        <div class="batch-controls">
          <div class="select-all-control">
            <input type="checkbox" id="selectAll" class="select-checkbox">
            <label for="selectAll">全选</label>
          </div>
          <button id="toggleSelect" class="batch-btn">选择</button>
          <button id="deleteSelected" class="batch-btn danger" style="display: none;">
            删除所选
          </button>
        </div>
      </div>

      <div class="notes-grid" id="notesList">
        <!-- 备注列表将通过 JS 动态插入 -->
      </div>
    </main>
  </div>
  <script src="management.js"></script>
</body>
</html>
