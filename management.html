<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="management.css">
</head>
<body>
  <div class="management-container">
    <header class="page-header">
      <div class="header-content">
        <div class="header-left">
          <img src="icons/icon48.png" class="header-icon">
          <h1 id="pageTitle">账号备注管理</h1>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="">
          <span class="search-icon">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
            </svg>
          </span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="tabs">
        <button id="notesTab" class="tab-btn active">Notes</button>
        <button id="settingsTab" class="tab-btn">Settings</button>
      </div>
      <div id="notesContent" class="tab-content active">
        <!-- 筛选区域 -->
        <div class="filter-container" id="filterContainer">
          <button id="favoriteFilter" class="favorite-filter-btn" title="只看收藏">
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="currentColor"/>
            </svg>
            <span>只看收藏</span>
          </button>
          <select id="tagFilter" class="tag-filter-select">
            <option value="">所有标签</option>
          </select>
        </div>

      <div class="control-bar">
        <div class="sort-controls">
          <select id="sortSelect" class="sort-select">
            <option value="updateTime" id="sortByTime">按更新时间排序</option>
            <option value="username" id="sortByUsername">按用户名排序</option>
            <option value="domain" id="sortByDomain">按网站排序</option>
          </select>
          <button id="sortDirection" class="sort-direction" title="">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M7 10l5 5 5-5H7z"/>
            </svg>
          </button>
        </div>
        <div class="batch-controls">
          <div class="select-all-control">
            <input type="checkbox" id="selectAll" class="select-checkbox">
            <label for="selectAll" id="selectAllLabel">全选</label>
          </div>
          <button id="toggleSelect" class="batch-btn">选择</button>
          <button id="deleteSelected" class="batch-btn danger" style="display: none;">
            删除所选
          </button>

        </div>
      </div>

      <div class="notes-grid" id="notesList">
        <!-- 备注列表将通过 JS 动态插入 -->
      </div>
      </div>
      <div id="settingsContent" class="tab-content">
        <div class="settings-container">
          <!-- 主题设置卡片 -->
          <div class="settings-card">
            <h2 class="card-title">外观设置</h2>
            <div class="card-content">
              <div class="theme-selector">
                <div class="theme-option active" data-theme="auto">
                  <div class="theme-option-icon">🌓</div>
                  <div class="theme-option-label">跟随系统</div>
                </div>
                <div class="theme-option" data-theme="light">
                  <div class="theme-option-icon">☀️</div>
                  <div class="theme-option-label">浅色</div>
                </div>
                <div class="theme-option" data-theme="dark">
                  <div class="theme-option-icon">🌙</div>
                  <div class="theme-option-label">深色</div>
                </div>
              </div>
            </div>
          </div>

          <!-- 标签管理卡片：标签依附于备注记录，此处只读展示使用统计，
               添加/移除入口在页面弹窗与备注编辑中——独立添加表单是假功能，已移除 -->
          <div class="settings-card">
            <h2 id="tagManagementTitle" class="card-title">标签管理</h2>
            <div class="card-content">
              <p class="switch-description" id="tagsFromNotesHint"></p>
              <div class="tags-list" id="tagsList">
                <!-- 标签列表将通过 JS 动态插入 -->
              </div>
            </div>
          </div>

          <!-- 已禁用网站卡片 -->
          <div class="settings-card">
            <h2 id="disabledSitesTitle" class="card-title">已禁用网站</h2>
            <div class="card-content">
              <div class="global-disable-switch">
                <label class="switch-label">
                  <span id="globalDisableText">全局禁用备注</span>
                  <div class="switch">
                    <input type="checkbox" id="globalDisableToggle">
                    <span class="slider round"></span>
                  </div>
                </label>
                <p class="switch-description" id="globalDisableDesc">启用此选项将在所有网站上禁用备注弹窗</p>
              </div>
              <div class="add-site-form">
                <input type="text" id="newSiteInput" placeholder="输入网站域名，如 example.com">
                <button id="addSiteBtn">添加</button>
              </div>
              <div class="disabled-sites-list" id="disabledSitesList">
                <!-- 禁用网站列表将通过 JS 动态插入 -->
              </div>
            </div>
          </div>
          
          <!-- 输入框锚定卡片 -->
          <div class="settings-card">
            <h2 id="fieldAnchorsTitle" class="card-title">输入框锚定</h2>
            <div class="card-content">
              <p class="switch-description" id="fieldAnchorsDesc">手动指定过的输入框会始终显示备注弹窗。识别不准时，可在扩展弹窗里重新指定。</p>
              <div class="field-anchors-list" id="fieldAnchorsList">
                <!-- 锚定记录将通过 JS 动态插入 -->
              </div>
            </div>
          </div>

          <!-- 数据管理卡片 -->
          <div class="settings-card">
            <h2 id="dataManagementTitle" class="card-title">数据管理</h2>
            <div class="card-content">
              <div class="data-management-actions">
                <button id="settingsExportBtn" class="settings-btn">
                  <svg viewBox="0 0 24 24" width="16" height="16" style="margin-right: 4px;">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/>
                  </svg>
                  <span id="settingsExportText">导出所有数据</span>
                </button>
                <button id="settingsImportBtn" class="settings-btn">
                  <svg viewBox="0 0 24 24" width="16" height="16" style="margin-right: 4px;">
                    <path d="M5 15h4v6h6v-6h4l-7-7-7 7zM5 4v2h14V4H5z" fill="currentColor"/>
                  </svg>
                  <span id="settingsImportText">导入数据</span>
                </button>
                <input type="file" id="settingsImportFileInput" accept=".json" style="display: none;">
              </div>
              <div class="data-management-actions danger-zone">
                <h3 id="clearDataTitle">清除所有数据</h3>
                <button id="clearAllDataBtn" class="settings-btn danger">
                  <span id="clearDataText">清除</span>
                </button>
              </div>
            </div>
          </div>
          
          <!-- 关于卡片 -->
          <div class="settings-card">
            <h2 id="aboutTitle" class="card-title">关于</h2>
            <div class="card-content">
              <div class="about-info">
                <div class="info-row">
                  <span class="info-label" id="versionLabel">版本:</span>
                  <span class="info-value" id="versionValue">1.1.0</span>
                </div>
                <div class="info-row">
                  <span class="info-label" id="developerLabel">开发者:</span>
                  <span class="info-value" id="developerValue">Account Note Team</span>
                </div>
                <div class="about-actions">
                  <a href="#" id="viewChangelogLink" class="text-link">查看更新日志</a>
                  <a href="#" id="reportIssueLink" class="text-link">反馈问题</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="management.js"></script>
</body>
</html>
