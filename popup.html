<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-left">
        <img src="icons/icon48.png" class="header-icon">
        <h1 id="extTitle"></h1>
      </div>
      <button class="manage-link" id="openManagement">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <main class="popup-content">
      <div class="site-info">
        <h2 id="currentSiteNotes"></h2>
        <div class="notes-list" id="notesList">
          <!-- 备注列表将通过 JS 动态插入 -->
        </div>
      </div>

      <!-- 当前站点已锚定的输入框数量 + 一键清除 -->
      <div class="anchor-panel" id="anchorPanel" hidden>
        <span class="anchor-count-text" id="anchorCountText"></span>
        <button type="button" class="anchor-clear-btn" id="clearAnchorBtn">
          <span id="clearAnchorText"></span>
        </button>
      </div>

      <!-- 手动锚定入口：识别不到时的兜底通道 -->
      <button type="button" class="pick-field-btn" id="pickFieldBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
          </g>
        </svg>
        <span id="pickFieldText"></span>
      </button>

      <!-- 拾取受阻时的可操作提示：说清原因 + 一键恢复。
           禁用类问题刷新页面解决不了，必须给出真正的出路 -->
      <div class="picker-hint" id="pickerHint" hidden>
        <span class="picker-hint-text" id="pickerHintText"></span>
        <button type="button" class="picker-hint-btn" id="pickerHintBtn" hidden></button>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
