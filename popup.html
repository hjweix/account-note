<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>密码备注助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <img src="icons/icon48.png" class="header-icon">
      <h1>密码备注助手</h1>
    </div>
    
    <div class="current-site">
      <h2>当前网站的备注</h2>
      <div id="current-notes" class="notes-container">
        <!-- 当前网站的备注将在这里动态显示 -->
      </div>
    </div>

    <div class="all-notes-link">
      <button id="showAllNotes" class="secondary-btn">
        查看所有备注 →
      </button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
